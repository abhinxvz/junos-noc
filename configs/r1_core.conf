system {
    host-name R1-CORE;
    root-authentication {
        plain-text-password-value "Juniper123!";
    }
    services {
        ssh {
            root-login allow;
            protocol-version v2;
        }
        netconf {
            ssh;
        }
    }
    login {
        user junos-admin {
            class super-user;
            authentication {
                plain-text-password-value "Juniper123!";
            }
        }
    }
}
interfaces {
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.1.11/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.0.0.1/32;
            }
        }
    }
    ge-0/0/0 {
        description "TO-R2-DIST:ge-0/0/0";
        unit 0 {
            family inet {
                address 10.10.12.1/30;
            }
        }
    }
    ge-0/0/1 {
        description "TO-R3-EDGE:ge-0/0/0";
        unit 0 {
            family inet {
                address 10.10.13.1/30;
            }
        }
    }
    ge-0/0/2 {
        description "DC-LAN-GATEWAY";
        unit 0 {
            family inet {
                address 192.168.10.1/24;
            }
        }
    }
    ge-0/0/3 {
        description "WAN-ISP-UPLINK";
        unit 0 {
            family inet {
                address 198.51.100.2/30;
            }
        }
    }
}
routing-options {
    router-id 10.0.0.1;
    autonomous-system 65001;
    static {
        route 0.0.0.0/0 next-hop 198.51.100.1;
    }
}
protocols {
    ospf {
        reference-bandwidth 10g;
        export EXPORT-DEFAULT;
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                interface-type p2p;
                metric 10;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
                metric 10;
            }
            interface ge-0/0/2.0 {
                passive;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
}
policy-options {
    policy-statement EXPORT-DEFAULT {
        term 1 {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
    }
}
