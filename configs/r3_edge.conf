system {
    host-name R3-EDGE;
    root-authentication {
        plain-text-password-value "Juniper123!";
    }
    services {
        ssh {
            root-login allow;
            protocol-version v2;
        }
        netconf {
            ssh;
        }
    }
    login {
        user junos-admin {
            class super-user;
            authentication {
                plain-text-password-value "Juniper123!";
            }
        }
    }
}
interfaces {
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.1.13/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.0.0.3/32;
            }
        }
    }
    ge-0/0/0 {
        description "TO-R1-CORE:ge-0/0/1";
        unit 0 {
            family inet {
                address 10.10.13.2/30;
            }
        }
    }
    ge-0/0/1 {
        description "TO-R2-DIST:ge-0/0/1";
        unit 0 {
            family inet {
                address 10.10.23.2/30;
            }
        }
    }
    ge-0/0/2 {
        description "BRANCH-B-LAN-GATEWAY";
        unit 0 {
            family inet {
                address 192.168.30.1/24;
            }
        }
    }
}
routing-options {
    router-id 10.0.0.3;
    autonomous-system 65001;
}
protocols {
    ospf {
        reference-bandwidth 10g;
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                interface-type p2p;
                metric 10;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
                metric 10;
            }
            interface ge-0/0/2.0 {
                passive;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
}
