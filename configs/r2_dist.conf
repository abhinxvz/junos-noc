system {
    host-name R2-DIST;
    root-authentication {
        plain-text-password-value "Juniper123!";
    }
    services {
        ssh {
            root-login allow;
            protocol-version v2;
        }
        netconf {
            ssh;
        }
    }
    login {
        user junos-admin {
            class super-user;
            authentication {
                plain-text-password-value "Juniper123!";
            }
        }
    }
}
interfaces {
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.1.12/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.0.0.2/32;
            }
        }
    }
    ge-0/0/0 {
        description "TO-R1-CORE:ge-0/0/0";
        unit 0 {
            family inet {
                address 10.10.12.2/30;
            }
        }
    }
    ge-0/0/1 {
        description "TO-R3-EDGE:ge-0/0/1";
        unit 0 {
            family inet {
                address 10.10.23.1/30;
            }
        }
    }
    ge-0/0/2 {
        description "BRANCH-A-LAN-GATEWAY";
        unit 0 {
            family inet {
                address 192.168.20.1/24;
            }
        }
    }
}
routing-options {
    router-id 10.0.0.2;
    autonomous-system 65001;
}
protocols {
    ospf {
        reference-bandwidth 10g;
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                interface-type p2p;
                metric 10;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
                metric 10;
            }
            interface ge-0/0/2.0 {
                passive;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
}
